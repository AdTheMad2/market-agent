[project]
name = "market-agent"
version = "0.1.0"
description = "Single-user market agent: scheduled scans, armed price-level alerts, sparse dashboard. Free tier only."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["engine", "sources", "render", "delivery", "jobs"]
