# Hand-edited watchlist. Tickers only.
#
# NOTHING ELSE GOES IN THIS FILE. No position sizes, no entry prices, no cost
# basis, no notes about holdings. This repository is public and anything
# committed to it must be assumed permanently public. docs/SPEC.md §9.
#
# The agent-screened list is generated separately into
# data/watchlist_screened.json and is never edited by hand.

tickers:
  - GOOGL
  - NVDA
  - AVGO

# Optional manually-armed price levels, mirroring the "alert me if it goes past
# X" workflow. Removed automatically at the post-close run once triggered.
# Levels are public market prices and carry no personal information.
#
# The pre-market job re-arms every level still listed here each morning, so a
# level stays live until it is deleted from this file — disarming it in the
# database is not enough.
#
# The five levels that lived here on 2026-08-06/07 were temporary: they existed
# to trip the daily ceiling on the first poll so the Phase 4 observable check
# could be observed against real prices. It passed (3 sent, 2 held back) and
# they were removed, because re-arming them would fire five junk alerts every
# morning. `scripts/verify_intraday.py` replays that window on demand and needs
# no armed level to do it.
armed_levels: []
